# [策略组]
proxy-groups:
  - name: "节点"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    timeout: 2000
    max-failed-times: 3
    include-all: true
    
  - name: "省流节点"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    timeout: 2000
    max-failed-times: 3
    filter: "0.2"
    include-all: true
    
  - name: "苹果服务"
    type: select
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/Apple-2.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - DIRECT
      - 香港节点
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 台湾节点

  - name: "Emby"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - DIRECT
      - 省流节点
      
  - name: "Telegram"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - 新加坡节点
      - 香港节点
      - 日本节点
      - 美国节点
      - 台湾节点

  - name: "微软服务"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - DIRECT
      - 香港节点
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
  
  - name: "AI"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - 日本节点
      - 美国节点
      - 香港节点
      - 新加坡节点
      - 台湾节点

  - name: "Google"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - 香港节点
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 台湾节点

  - name: "Spotify"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - 美国节点
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      
  - name: "全球服务"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - 香港节点
      - 日本节点
      - 美国节点
      - 新加坡节点
      - 台湾节点

  - name: "黑白名单"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - 香港节点
      - 日本节点
      - 美国节点
      - 新加坡节点
      - 台湾节点

  - name: "香港节点"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/HK.png
    timeout: 2000
    max-failed-times: 3
    filter: "香港|港|HK|🇭🇰|(?i)Hong"
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800

  - name: "台湾节点"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/TW.png
    timeout: 2000
    max-failed-times: 3
    filter: "台湾|台|TW|🇹🇼|(?i)Taiwan"
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800

  - name: "日本节点"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/JP.png
    timeout: 2000
    max-failed-times: 3
    filter: "日本|JP|🇯🇵|(?i)Japan"
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800

  - name: "新加坡节点"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/SG.png
    timeout: 2000
    max-failed-times: 3
    filter: "新加坡|狮|SG|🇸🇬|(?i)Singapore"
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800
 
  - name: "美国节点"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/US.png
    filter: "美国|美|US|🇺🇸|(?i)States"
    timeout: 2000
    max-failed-times: 3
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800
    
# [本地规则]
rules:
  - DOMAIN-KEYWORD, emby, Emby
  - IP-ASN, 44907, 新加坡节点
  - IP-ASN, 62014, 新加坡节点
#  - IP-CIDR, 10.0.0.0/8, DIRECT
  - IP-CIDR, 172.16.0.0/12, DIRECT
#  - IP-CIDR, 192.168.0.0/16, DIRECT
  - RULE-SET,GitHub,香港节点
  - RULE-SET,Speedtest,DIRECT
  - RULE-SET,Emby,Emby
  - RULE-SET,苹果服务,苹果服务 
  - RULE-SET,Amazon,美国节点
  - RULE-SET,Telegram,Telegram  
  - RULE-SET,AI,AI
  - RULE-SET,微软服务,微软服务
  - RULE-SET,Google,Google
  - RULE-SET,Spotify,Spotify
  - RULE-SET,全球服务,全球服务  
  - RULE-SET,LAN,DIRECT 
  - GEOIP, CN,DIRECT
  - MATCH,黑白名单
  

# [远程规则]
