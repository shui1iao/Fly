[General]
# 日志级别
loglevel = notify

# 测试超时
test-timeout = 2

# 混合网络
all-hybrid = false

# 网络助理
wifi-assist = false

# 游戏优化
udp-priority = false

# 直连网络测试
internet-test-url = http://taobao.com/

# 代理策略测试
proxy-test-url = http://cp.cloudflare.com/generate_204

# GEOIP数据库
geoip-maxmind-url = https://github.com/Masaiki/GeoIP2-CN/raw/release/Country.mmdb

# 不自动更新geoip
disable-geoip-db-auto-update = true

# DNS服务器
dns-server = system

# 从/etc/hosts读取DNS记录
read-etc-hosts = true

# 排除简单主机名
exclude-simple-hostnames = true

# 显示拒绝错误页
show-error-page-for-reject = true

# UDP回退行为
udp-policy-not-supported-behaviour = REJECT

# DNS劫持
hijack-dns = *:53

# Always Real IP
always-real-ip = *.msftconnecttest.com, *.msftncsi.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, *.logon.battlenet.com.cn, *.logon.battle.net, stun.l.google.com

# ipv6
ipv6 = false
ipv6-vif = auto

[Proxy]

[Proxy Group]
代理 = select, "🇭🇰 Yxvm", "🇸🇬 ByteVirt", "🇸🇬 ByteVirt <- YxVM", "🇺🇸 BWG", "🇺🇸 BackWaves", no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/Surge(8).png, update-interval=0

# 节点= select, policy-path=******, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/Surge(8).png

