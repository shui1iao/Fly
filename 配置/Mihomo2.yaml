# [策略组]
proxy-groups:
  - name: "𝗣𝗿𝗼𝘅𝘆"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    timeout: 2000
    max-failed-times: 3
    include-all: true

  - name: "𝗘𝗺𝗯𝘆"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - 𝗨𝗦
      - 𝗛𝗞
      - 𝗦𝗚
      
  - name: "𝗧𝗲𝗹𝗲𝗴𝗿𝗮𝗺"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - 𝗛𝗞
      - 𝗦𝗚
      - 𝗨𝗦
  
  - name: "𝗔𝗜"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - 𝗦𝗚
      - 𝗨𝗦
      - 𝗛𝗞

  - name: "𝗚𝗼𝗼𝗴𝗹𝗲"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - 𝗨𝗦
      - 𝗛𝗞
      - 𝗦𝗚

  - name: "𝗬𝗼𝘂𝘁𝘂𝗯𝗲"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - 𝗛𝗞
      - 𝗦𝗚
      - 𝗨𝗦

  - name: "𝗙𝗶𝗻𝗮𝗹"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Direct.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - 𝗛𝗞
      - 𝗦𝗚
      - 𝗨𝗦

  - name: "𝗛𝗞"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    timeout: 2000
    max-failed-times: 3
    filter: "香港|港|HK|🇭🇰|(?i)Hong"
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800   

  - name: "𝗦𝗚"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
    timeout: 2000
    max-failed-times: 3
    filter: "新加坡|狮|SG|🇸🇬|(?i)Singapore"
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800

  - name: "𝗨𝗦"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    filter: "美国|美|US|🇺🇸|(?i)States"
    timeout: 2000
    max-failed-times: 3
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800


# [本地规则]
rules:
  - RULE-SET,𝗦𝗽𝗲𝗲𝗱𝘁𝗲𝘀𝘁,𝗣𝗿𝗼𝘅𝘆
  - RULE-SET,𝗘𝗺𝗯𝘆,𝗘𝗺𝗯𝘆
  - RULE-SET,𝗔𝗽𝗽𝗹𝗲,DIRECT
  - RULE-SET,𝗧𝗲𝗹𝗲𝗴𝗿𝗮𝗺,𝗧𝗲𝗹𝗲𝗴𝗿𝗮𝗺
  - RULE-SET,𝗔𝗜,𝗔𝗜
  - RULE-SET,𝗚𝗼𝗼𝗴𝗹𝗲,𝗚𝗼𝗼𝗴𝗹𝗲
  - RULE-SET,𝗬𝗼𝘂𝘁𝘂𝗯𝗲,𝗬𝗼𝘂𝘁𝘂𝗯𝗲
  - RULE-SET,𝗦𝗽𝗼𝘁𝗶𝗳𝘆,𝗨𝗦
  - RULE-SET,𝗟𝗔𝗡,DIRECT 
  - GEOIP,CN,DIRECT
  - MATCH,𝗙𝗶𝗻𝗮𝗹

# [远程规则]
rule-providers:

  𝗦𝗽𝗲𝗲𝗱𝘁𝗲𝘀𝘁:
    behavior: classical
    interval: 86400
    type: http
    path: ./Speedtest/Speedtest.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Speedtest/Speedtest.yaml
    
  𝗔𝗽𝗽𝗹𝗲:
    behavior: classical
    interval: 86400
    type: http
    path: ./Apple/Apple_Classical.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple_Classical.yaml
    
  𝗘𝗺𝗯𝘆:
    behavior: classical
    interval: 86400
    type: http
    format: text
    path: ./Emby/Emby.list
    url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/Emby.list

  𝗧𝗲𝗹𝗲𝗴𝗿𝗮𝗺:
    behavior: classical
    interval: 86400
    type: http
    path: ./Telegram/Telegram.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Telegram/Telegram.yaml
    
  𝗔𝗜:
    behavior: classical
    interval: 86400
    type: http
    format: text
    path: ./AI/AI.lsit
    url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/AI.list

  𝗚𝗼𝗼𝗴𝗹𝗲:
    behavior: classical
    interval: 86400
    type: http
    path: ./Google/Google.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml

  𝗬𝗼𝘂𝘁𝘂𝗯𝗲:
    behavior: classical
    interval: 86400
    type: http
    path: ./YouTub/YouTub.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/YouTube/YouTube.yaml
  
  𝗦𝗽𝗼𝘁𝗶𝗳𝘆:
    behavior: classical
    interval: 86400
    type: http
    path: ./Spotify/Spotify.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.yaml

  𝗟𝗔𝗡:
    behavior: classical
    interval: 86400
    type: http
    path: ./LAN/LAN.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml
