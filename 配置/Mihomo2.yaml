# [策略组]
proxy-groups:
  - name: "Proxy"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    timeout: 2000
    max-failed-times: 3
    include-all: true
      
  - name: "Final"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - SG
      - US
      - JP
      - HK

  - name: "SG"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
    filter: "新加坡|狮|SG|🇸🇬|sing"
    timeout: 2000
    max-failed-times: 3
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800
     
  - name: "US"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    filter: "美国|美|US|🇺🇸|(?i)States"
    timeout: 2000
    max-failed-times: 3
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800

  - name: "HK"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    filter: "香港|港|HK|🇭🇰|HONG"
    timeout: 2000
    max-failed-times: 3
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800

  - name: "JP"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    filter: "日本|JP|Japan|🇯🇵"
    timeout: 2000
    max-failed-times: 3
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800

# [本地规则]
rules:
  - RULE-SET,𝗦𝗽𝗲𝗲𝗱𝘁𝗲𝘀𝘁,Proxy
  - RULE-SET,𝗔𝗜,US
  - RULE-SET,𝗣𝗮𝘆𝗣𝗮𝗹,HK
  - RULE-SET,𝗘𝗺𝗯𝘆,US
  - RULE-SET,𝗔𝗽𝗽𝗹𝗲,DIRECT
  - RULE-SET,𝗟𝗔𝗡,DIRECT 
  - GEOIP,CN,DIRECT
  - MATCH,Final

# [远程规则]
rule-providers:

  𝗦𝗽𝗲𝗲𝗱𝘁𝗲𝘀𝘁:
    behavior: classical
    interval: 86400
    type: http
    path: ./Speedtest/Speedtest.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Speedtest/Speedtest.yaml

  𝗔𝗜:
    behavior: classical
    interval: 86400
    type: http
    format: text
    path: ./AI/AI.list
    url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/AI.list
  
  𝗣𝗮𝘆𝗣𝗮𝗹:
    behavior: classical
    interval: 86400
    type: http
    path: ./PayPal/PayPal.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PayPal/PayPal.yaml

  𝗘𝗺𝗯𝘆:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./Emby/Emby.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/Emby.list
     
  𝗔𝗽𝗽𝗹𝗲:
    behavior: classical
    interval: 86400
    type: http
    path: ./Apple/Apple_Classical.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple_Classical.yaml

  𝗟𝗔𝗡:
    behavior: classical
    interval: 86400
    type: http
    path: ./LAN/LAN.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml
