# [策略组]
proxy-groups:
  - name: "Proxy"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    timeout: 2000
    max-failed-times: 3
    include-all: true
    
  - name: "Apple"
    type: select
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/Apple-2.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - DIRECT
      - HK
      - US
      - SG

  - name: "Emby"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - US
      - HK
      - SG
      
  - name: "Telegram"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - HK
      - SG
      - US
  
  - name: "AI"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - SG
      - US
      - HK

  - name: "Google"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - US
      - HK
      - SG

  - name: "Final"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png
    timeout: 2000
    max-failed-times: 3
    proxies: 
      - HK
      - SG
      - US

  - name: "HK"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    timeout: 2000
    max-failed-times: 3
    filter: "香港|港|HK|🇭🇰|(?i)Hong"
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800   

  - name: "SG"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
    timeout: 2000
    max-failed-times: 3
    filter: "新加坡|狮|SG|🇸🇬|(?i)Singapore"
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800

  - name: US"
    type: url-test
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    filter: "美国|美|US|🇺🇸|(?i)States"
    timeout: 2000
    max-failed-times: 3
    include-all: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800


# [本地规则]
rules:
  - DOMAIN-KEYWORD, emby, Emby
  - RULE-SET,Speedtest,Proxy
  - RULE-SET,Emby,Emby
  - RULE-SET,Apple,Apple 
  - RULE-SET,Telegram,Telegram  
  - RULE-SET,AI,AI
  - RULE-SET,Google,Google
  - RULE-SET,Spotify,US
  - RULE-SET,LAN,DIRECT 
  - GEOIP, CN,DIRECT
  - MATCH,Final

# [远程规则]
rule-providers:

  Speedtest:
    behavior: classical
    interval: 86400
    type: http
    path: ./Speedtest/Speedtest.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Speedtest/Speedtest_No_Resolve.yaml
    
  Apple:
    behavior: classical
    interval: 86400
    type: http
    path: ./Apple/Apple_Classical.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple_Classical_No_Resolve.yaml
    
  Emby:
    behavior: classical
    interval: 86400
    type: http
    path: ./Emby/Emby.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Emby/Emby.yaml

  Telegram:
    behavior: classical
    interval: 86400
    type: http
    path: ./Telegram/Telegram.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Telegram/Telegram_No_Resolve.yaml
    
  AI:
    behavior: classical
    interval: 86400
    type: http
    path: ./AI/AI.yaml
    url: https://kelee.one/Tool/Clash/Rule/AI.yaml

  Google:
    behavior: classical
    interval: 86400
    type: http
    path: ./Google/Google.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google_No_Resolve.yaml
    
  Spotify:
    behavior: classical
    interval: 86400
    type: http
    path: ./Spotify/Spotify.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify_No_Resolve.yaml

  LAN:
    behavior: classical
    interval: 86400
    type: http
    path: ./LAN/LAN.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml
