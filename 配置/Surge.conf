[General]
# 日志级别
loglevel = notify

# 测试超时
test-timeout = 2

# 混合网络
all-hybrid = false

# 网络助理
wifi-assist = false

# 游戏优化
udp-priority = false

# 直连网络测试
internet-test-url = http://taobao.com/

# 代理策略测试
proxy-test-url = http://cp.cloudflare.com/generate_204

# GEOIP数据库
geoip-maxmind-url = https://github.com/Masaiki/GeoIP2-CN/raw/release/Country.mmdb

# DNS服务器
dns-server = system

# 加密DNS服务器
encrypted-dns-server = quic://223.5.5.5:853

# 从/etc/hosts读取DNS记录
read-etc-hosts = true

# 排除简单主机名
exclude-simple-hostnames = true

# 显示拒绝错误页
show-error-page-for-reject = true

# UDP回退行为
udp-policy-not-supported-behaviour = REJECT

# DNS劫持
hijack-dns = *:53

# Always Real IP
always-real-ip = *.msftconnecttest.com, *.msftncsi.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, *.logon.battlenet.com.cn, *.logon.battle.net, stun.l.google.com

[Proxy Group]
# 节点
WestData = select, policy-path=, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png

# 苹果服务
苹果服务 = select, DIRECT, 日本节点, 香港节点, 台湾节点, 新加坡节点, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/Apple-2.png

# Telegram
Telegram = select, 新加坡节点, 香港节点, 日本节点, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png

# Google
Google = select, 日本节点, 香港节点, 台湾节点, 新加坡节点, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png

# AI
AI = select, 日本节点, 香港节点, 台湾节点, 新加坡节点, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png

# Spotify
Spotify = select, 美国节点, 日本节点, 台湾节点, 新加坡节点, 香港节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png

# Microsoft
Microsoft = select, DIRECT, 日本节点, 香港节点, 台湾节点, 新加坡节点, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png

# Amazon
Amazon = select, 美国节点, 日本节点, 香港节点, 台湾节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Amazon.png

# YouTube
YouTube = select, 日本节点, 香港节点, 台湾节点, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png

# Instagram
Instagram = select, 香港节点, 日本节点, 台湾节点, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Instagram.png

# 全球服务
全球服务 = select, 日本节点, 香港节点, 台湾节点, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png

# 黑白名单
黑白名单 = select, 日本节点, 香港节点, 台湾节点, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png

# 香港节点
香港节点 = smart, update-interval=0, policy-regex-filter=香港|港|HK|🇭🇰|(?i)Hong, no-alert=0, hidden=1, include-all-proxies=0, include-other-group="Flyingbird, WestData", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

# 台湾节点
台湾节点 = smart, update-interval=0, policy-regex-filter=台湾|台|TW|🇹🇼|(?i)Taiwan, no-alert=0, hidden=1, include-all-proxies=0, include-other-group="Flyingbird, WestData", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png

# 日本节点
日本节点 = smart, update-interval=0, policy-regex-filter=日本|日|JP|🇯🇵|(?i)Japan, no-alert=0, hidden=1, include-all-proxies=0, include-other-group="Flyingbird, WestData", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png

# 新加坡节点
新加坡节点 = smart, update-interval=0, policy-regex-filter=新加坡|狮|SG|🇸🇬|(?i)Singapore, no-alert=0, hidden=1, include-all-proxies=0, include-other-group="Flyingbird, WestData", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png

# 美国节点
美国节点 = smart, update-interval=0, policy-regex-filter=美国|USA|United States, no-alert=0, hidden=1, include-all-proxies=0, include-other-group="Flyingbird, WestData", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

