# 黑白名单
香港节点 = smart, update-interval=0, policy-regex-filter=香港|港|HK|🇭🇰|(?i)Hong, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=节点, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

# 香港节点
台湾节点 = smart, update-interval=0, policy-regex-filter=台湾|台|TW|🇹🇼|(?i)Taiwan, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=节点, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png

# 台湾节点
日本节点 = smart, update-interval=0, policy-regex-filter=日本|日|JP|🇯🇵|(?i)Japan, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=节点, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png

# 日本节点
新加坡节点 = smart, update-interval=0, policy-regex-filter=新加坡|狮|SG|🇸🇬|(?i)Singapore, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=节点, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png

# 新加坡节点
美国节点 = smart, update-interval=0, policy-regex-filter=美国|USA|United States, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=节点, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

