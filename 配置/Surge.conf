[General]
# 日志级别
loglevel = notify

# 测试超时
test-timeout = 5

# 混合网络
all-hybrid = false

# 网络助理
wifi-assist = false

# 游戏优化
udp-priority = false

# 允许访问
allow-wifi-access = false
allow-hotspot-access = false

# 直连网络测试
internet-test-url = http://taobao.com/

# 代理策略测试
proxy-test-url = http://cp.cloudflare.com/generate_204

# 自定义数据库
geoip-maxmind-url = https://github.com/Masaiki/GeoIP2-CN/raw/release/Country.mmdb

# 常规DNS服务器
dns-server = 223.5.5.5

# 加密DNS服务器
encrypted-dns-server = quic://223.5.5.5:853

# 排除简单主机名
exclude-simple-hostnames = true

# 显示拒绝错误页
show-error-page-for-reject = true
use-local-host-item-for-proxy = true

[Proxy Group]
# 节点
飞鸟 = select, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=^, policy-path=, icon-url=https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/Static.png

# 手动选择
西数 = select, policy-path=, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, policy-regex-filter=*, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png

# 自动选择
手动选择 = select, 日本节点, 自动选择, 香港节点, 台湾节点, 新加坡节点, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Area.png

# 苹果服务
自动选择 = smart, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=^, include-other-group=飞鸟, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png

# Telegram
苹果服务 = select, DIRECT, 手动选择, 自动选择, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/Apple-2.png

# Google
Telegram = select, 香港节点, 手动选择, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png

# AI
Google = select, 日本节点, 手动选择, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png

# Spotify
AI = select, 日本节点, 手动选择, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png

# Microsoft
Spotify = select, 美国节点, 日本节点, 手动选择, 香港节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png

# Amazon
Microsoft = select, DIRECT, 美国节点, 手动选择, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png

# YouTube
Amazon = select, 美国节点, 日本节点, 手动选择, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Amazon_1.png

# Instagram
YouTube = select, 日本节点, 手动选择, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png

# 全球服务
Instagram = select, 香港节点, 手动选择, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Instagram.png

# 黑白名单
全球服务 = select, 手动选择, 自动选择, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png

# 其他区域
黑白名单 = select, 手动选择, 自动选择, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/Final.png


# 其他区域
其他区域 = select, update-interval=0, policy-regex-filter=^(?!.*(香港|HK|Hong Kong|HongKong|台湾|TW|Tai|日本|JP|Japan|美国|USA|US|United States|新加坡|狮城|SG|Singapore)).*, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="飞鸟, 西数", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/World_Map.png

# 香港节点
香港节点 = smart, update-interval=0, policy-regex-filter=香港|港|HK|🇭🇰|(?i)Hong, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="飞鸟, 西数", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

# 台湾节点
台湾节点 = smart, update-interval=0, policy-regex-filter=台湾|台|TW|🇹🇼|(?i)Taiwan, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="飞鸟, 西数", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png

# 日本节点
日本节点 = smart, update-interval=0, policy-regex-filter=日本|日|JP|🇯🇵|(?i)Japan, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="飞鸟, 西数", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png

# 新加坡节点
新加坡节点 = smart, update-interval=0, policy-regex-filter=新加坡|狮|SG|🇸🇬|(?i)Singapore, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="飞鸟, 西数", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png

# 美国节点
美国节点 = smart, update-interval=0, policy-regex-filter=美国|USA|United States, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="飞鸟, 西数", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

