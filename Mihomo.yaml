proxy-groups:
  - name: "Proxy"
    type: select
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/03CNSoft/speedtest.png
    include-all: true
    filter: "^(?!.*(Flower-|ikuu-|IEPL)).*$"
      
  - name: "Final"
    type: fallback
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/quanqiu(1).png
    proxies: 
      - HK
      - SG
      - JP
      - US
      - Flower

  - name: "AI"
    type: fallback
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/chatgpt(balck).png
    proxies:
      - SG
      - JP
      - US
      
  - name: "Emby"
    type: fallback
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/emby.png
    proxies:
      - Flower
      - Final

  - name: "HK"
    type: url-test
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/Hongkong(2).png
    include-all: true
    filter: "^(?!.*(Flower-|ikuu-|🇯🇵|🇸🇬|🇺🇸|🇨🇳|🇩🇪|🇨🇳|🇬🇧|IEPL|🇪🇸)).*$"

  - name: "SG"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/Singapore(2).png
    filter: "^(?!.*(Flower-|ikuu-|🇭🇰|🇯🇵|🇺🇸|🇨🇳|🇩🇪|🇨🇳|🇬🇧|IEPL|🇪🇸)).*$"
    
  - name: "JP"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/Japan(1).png
    filter: "^(?!.*(Flower-|ikuu-|🇭🇰|🇸🇬|🇺🇸|🇨🇳|🇩🇪|🇨🇳|🇬🇧|IEPL|🇪🇸)).*$"

  - name: "US"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/US(1).png
    filter: "^(?!.*(Flower-|ikuu-|🇭🇰|🇯🇵|🇸🇬|🇩🇪|🇨🇳|🇬🇧|IEPL|🇪🇸)).*$"
    
  - name: "Flower"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/06jichang/FlowerCloud.png
    filter: "Flower-HK"

  - name: "Flower-JP"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/06jichang/FlowerCloud.png
    filter: "Flower-JP"
    
