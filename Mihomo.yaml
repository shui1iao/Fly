# [策略组]
proxy-groups:
  - name: "Proxy"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    timeout: 2000
    max-failed-times: 3
    include-all: true

  - name: "Final"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    proxies: 
      - 🇭🇰 CNFaster<-HK
      - US
      - JP
      
  - name: "AI"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    proxies: 
      - US
      - JP

  - name: "Google"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
    proxies: 
      - US
      - CNFaster<-HK

  - name: "Emby"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
    proxies: 
      - US
      - JP

  - name: "HK"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    filter: "香港|港|🇭🇰|(?i)Hongkong"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800
    
  - name: "JP"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    filter: "日本|日|🇯🇵|(?i)Japan"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800
 
  - name: "US"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    filter: "美国|美|🇺🇸|(?i)States"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800


# [本地规则]
rules:
  - DOMAIN-KEYWORD,emby,Emby
  - RULE-SET,Speedtest,Proxy
  - RULE-SET,AI,AI
  - RULE-SET,Emby,Emby
  - RULE-SET,Google,Google
  - RULE-SET,YouTube,Google
  - RULE-SET,LAN,DIRECT 
  - GEOIP,CN,DIRECT
  - MATCH,Final
  
# [远程规则]
rule-providers:

  Speedtest:
     behavior: classical
     interval: 86400
     type: http
     path: ./Emby/Emby.list
     url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Speedtest/Speedtest.yaml

  Emby:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./Emby/Emby.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/Emby.list

  AI:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./AI/AI.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/AI.list
     
  Google:
     behavior: classical
     interval: 86400
     type: http
     path: ./Google/Google.list
     url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml

  YouTube:
     behavior: classical
     interval: 86400
     type: http
     path: ./YouTube/YouTube.list
     url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml
     
  LAN:
    behavior: classical
    interval: 86400
    type: http
    path: ./LAN/LAN.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml
