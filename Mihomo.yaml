# [策略组]
proxy-groups:
  - name: "𝗣𝗿𝗼𝘅𝘆"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    timeout: 2000
    max-failed-times: 3
    include-all: true

  - name: "𝗙𝗶𝗻𝗮𝗹"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    proxies: 
      - 𝗦𝗚
      - 𝗝𝗣
      - 𝗨𝗦
      
  - name: "𝗔𝗜"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    proxies: 
      - 𝗝𝗣
      - 𝗦𝗚
      - 𝗨𝗦

  - name: "𝗦𝗚"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
    filter: "新加坡|狮|🇸🇬|(?i)Singapore"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800
    
  - name: "𝗝𝗣"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    filter: "日本|日|🇯🇵|(?i)Japan"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800
 
  - name: "𝗨𝗦"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    filter: "美国|美|🇺🇸|(?i)States"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800


# [本地规则]
rules:
  - DOMAIN-KEYWORD,emby,𝗨𝗦
  - RULE-SET,𝗦𝗽𝗲𝗲𝗱𝘁𝗲𝘀𝘁,𝗣𝗿𝗼𝘅𝘆
  - RULE-SET,𝗔𝗜,𝗔𝗜
  - RULE-SET,𝗘𝗺𝗯𝘆,𝗨𝗦
  - RULE-SET,𝗔𝗽𝗽𝗹𝗲,DIRECT
  - RULE-SET,𝗟𝗔𝗡,DIRECT 
  - GEOIP,CN,DIRECT
  - MATCH,𝐅𝐢𝐧𝐚𝐥
  
# [远程规则]
rule-providers:

  𝗦𝗽𝗲𝗲𝗱𝘁𝗲𝘀𝘁:
    behavior: classical
    interval: 86400
    type: http
    path: ./Speedtest/Speedtest.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Speedtest/Speedtest.yaml
  
  𝗘𝗺𝗯𝘆:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./Emby/Emby.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/Emby.list

  𝗔𝗜:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./AI/AI.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/AI.list
     
  𝗔𝗽𝗽𝗹𝗲:
    behavior: classical
    interval: 86400
    type: http
    path: ./Apple/Apple_Classical.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple_Classical.yaml

  𝗟𝗔𝗡:
    behavior: classical
    interval: 86400
    type: http
    path: ./LAN/LAN.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml
