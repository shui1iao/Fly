# [策略组]
proxy-groups:
  - name: "Proxy"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    include-all: true
    filter: "BW|Bage|RFC"
      
  - name: "Final"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    proxies: 
      - HK
      - JP
      - US

  - name: "AI"
    type: load-balance
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    include-all: true
    filter: "BWH|RFC"

  - name: "Google"
    type: load-balance
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/google(2).png
    include-all: true
    filter: "BWH|RFC"

  - name: "HK"
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    url: "http://1.1.1.1/generate_204"
    interval: 1800
    include-all: true
    filter: "Bage|RFC"
    
  - name: "JP"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    filter: "🇯🇵.*BW"
    url: "http://1.1.1.1/generate_204"
    interval: 1800

  - name: "US"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    filter: "BWH"
    url: "http://1.1.1.1/generate_204"
    interval: 1800

  - name: "Dler"
    type: select
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud.png
    filter: "^(?!.*(BWH|wap|Bage)).*$"
    timeout: 2000
    max-failed-times: 3

  - name: "Dler-HK"
    type: select
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud.png
    filter: "🇭🇰.*(AC|Ultra))"
    timeout: 2000
    max-failed-times: 3
  
  
# [本地规则]
rules:
  - RULE-SET,Speedtest,Proxy
  - RULE-SET,AI,AI
  - RULE-SET,Google,Google
  - RULE-SET,LAN,DIRECT 
  - GEOIP,CN,DIRECT
  - MATCH,Final
  
# [远程规则]
rule-providers:

  Speedtest:
    behavior: classical
    type: http
    nterval: 86400
    path: ./Speedtest.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Speedtest/Speedtest_No_Resolve.yaml

  AI:
    behavior: classical
    type: http
    format: text
    nterval: 86400
    path: ./AI.list
    url: https://raw.githubusercontent.com/ConnersHua/RuleGo/refs/heads/master/Surge/Ruleset/Extra/AI.list

  Google:
    behavior: classical
    type: http
    nterval: 86400
    path: ./Google.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Google/Google_No_Resolve.yaml

  LAN:
    behavior: classical
    interval: 86400
    type: http
    format: text
    path: ./Lan.list
    url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Clash/Rules/Lan.list
