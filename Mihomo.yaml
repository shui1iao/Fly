proxy-groups:
  - name: "Proxy"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    include-all: true
    max-failed-times: 2
    filter: "Sharon|BWH|Ali|Dler|Bero|Seednet|Neburst|Legend"
    proxies: 
      - 🇭🇰 DMIT-Dler
      - 🇸🇬 Bage-Dler
      - 🇯🇵 BW-Dler
      
  - name: "Final"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    proxies: 
      - HK
      - SG
      - JP
      - US

  - name: "AI"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    proxies:
      - US
      - JP
      - SG

  - name: "Google"
    type: fallback
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/google(2).png
    proxies:
      - US
      - HK
      - SG
      - JP

  - name: "Telegram"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
    proxies:
      - SG
      - HK
      - JP
      - US

  - name: "HK"
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    max-failed-times: 2
    include-all: true
    filter: "🇭🇰.*(Sharon|DMIT|Neburst)"
    
  - name: "SG"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
    filter: "🇸🇬.*(Bage|Legend)"
    
  - name: "JP"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    filter: "🇯🇵.*(BW)"

  - name: "US"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    filter: "🇺🇸.*(BWH|Bage)"

  - name: "Dler"
    type: select
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud.png
    filter: "^(?!.*(BW|DMIT|Bage|Sharon|Neburst|Legend|Ali|Bero|Seednet|Dler)).*$"

  - name: "🇭🇰 DMIT-Dler"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud(1).png
    filter: "DMIT.*(AC|Ultra|Pro|Std)"
    hidden: true

  - name: "🇸🇬 Bage-Dler"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud(1).png
    filter: "Bage.*(AC|Ultra|Pro|Std)"
    hidden: true

  - name: "🇯🇵 BW-Dler"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud(1).png
    filter: "BW.*(Plus|Max|BGP)"
    hidden: true


