# [策略组]
proxy-groups:
  - name: "Proxy"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    include-all: true
    filter: "BWH|Bage|wap|Legend"
      
  - name: "Final"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    proxies: 
      - HK
      - JP
      - US

  - name: "AI"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    proxies: 
      - US
      - JP

  - name: "Google"
    type: fallback
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/google(2).png
    proxies: 
      - US
      - HK
      - JP
      
  - name: "Apple"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
    proxies: 
      - HK
      - DIRECT
      - US
      - JP
      
  - name: "Emby"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
    proxies: 
      - HK
      - US
      - JP

  - name: "HK"
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    url: "http://1.1.1.1/generate_204"
    interval: 1800
    include-all: true
    filter: "Bage"

  - name: "JP"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    filter: "wap"
    url: "http://1.1.1.1/generate_204"
    interval: 1800

  - name: "US"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    filter: "BWH"
    url: "http://1.1.1.1/generate_204"
    interval: 1800

  - name: "Dler"
    type: select
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud.png
    filter: "^(?!.*(BWH|wap|Bage)).*$"
    timeout: 2000
    max-failed-times: 3

  - name: "Dler-HK"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud(1).png
    filter: "^(?!.*Bage).*🇭🇰.*(Ultra|AC).*"
    url: "http://1.1.1.1/generate_204"
    timeout: 2000
    max-failed-times: 3
    
  - name: "Dler-US"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud(1).png
    filter: "^(?!.*BWH).*🇺🇸.*(AC|Plus).*"
    url: "http://1.1.1.1/generate_204"
    timeout: 2000
    max-failed-times: 3

# [本地规则]
rules:
  - DOMAIN-KEYWORD,emby,Emby
  - DOMAIN,e.2233333.xyz,Emby
  - RULE-SET,Speedtest,Proxy
  - RULE-SET,AI,AI
  - RULE-SET,Emby,Emby
  - RULE-SET,Apple_cn,DIRECT
  - RULE-SET,Apple,Apple
  - RULE-SET,Telegram,Final
  - RULE-SET,Google,Google
  - RULE-SET,YouTube,Google
  - RULE-SET,Global,Final
  - RULE-SET,China,DIRECT
  - RULE-SET,LAN,DIRECT 
  - GEOIP,CN,DIRECT
  - MATCH,Final
  
# [远程规则]
rule-providers:

  Speedtest:
    behavior: classical
    type: http
    nterval: 86400
    path: ./Speedtest.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Speedtest/Speedtest_No_Resolve.yaml
     
  Emby:
    behavior: classical
    interval: 86400
    type: http
    format: text
    path: ./Emby.list
    url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/Emby.list

  AI:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./AI.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/AI.list
  
  Google:
     behavior: classical
     interval: 86400
     type: http
     path: ./Google.yaml
     url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google_No_Resolve.yaml

  YouTube:
     behavior: classical
     interval: 86400
     type: http
     path: ./YouTube.yaml
     url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube_No_Resolve.yaml

  Apple_cn:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./apple_cn.txt
     url: https://ruleset.skk.moe/Clash/non_ip/apple_cn.txt

  Apple:
     behavior: classical
     interval: 86400
     type: http
     path: ./Apple.yaml
     url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple_Classical_No_Resolve.yaml

  Telegram:
     behavior: classical
     interval: 86400
     type: http
     path: ./Telegram.yaml
     url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Telegram/Telegram_No_Resolve.yaml

  Global:
     behavior: classical
     interval: 86400
     type: http
     path: ./Global.yaml
     url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global_Classical_No_Resolve.yaml

  China:
    behavior: classical
    interval: 86400
    type: http
    path: ./China.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/China/China_Classical_No_Resolve.yaml
     
  LAN:
    behavior: classical
    interval: 86400
    type: http
    path: ./Lan.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Lan/Lan_No_Resolve.yaml
