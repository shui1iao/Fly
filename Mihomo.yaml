# [策略组]
proxy-groups:
  - name: "Proxy"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    include-all: true
    filter: "KXY"
    proxies: 
      - 🇭🇰 Bage<-Dler
      - 🇯🇵 Dler
      
  - name: "Final"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    proxies: 
      - 🇭🇰 Bage<-Dler
      - 🇯🇵 Dler
      - 🇺🇸 KXY<-BWH

  - name: "AI"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    proxies: 
      - 🇺🇸 KXY<-BWH
      - 🇯🇵 Dler

  - name: "Google"
    type: fallback
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/google(2).png
    proxies: 
      - 🇺🇸 KXY<-BWH
      - 🇭🇰 Bage<-Dler
      - 🇯🇵 Dler

  - name: "Emby"
    type: load-balance
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
    proxies: 
      - 🇭🇰 Bage<-Dler
      - 🇺🇸 KXY<-BWH
      - 🇯🇵 Dler

  - name: "🇭🇰 Bage<-Dler"
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    url: "http://1.1.1.1/generate_204"
    interval: 1800
    include-all: true
    filter: "🇭🇰"

  - name: "🇯🇵 Dler"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    filter: "🇯🇵"
    url: "http://1.1.1.1/generate_204"
    interval: 1800

  - name: "Dler"
    type: select
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud.png
    filter: "^(?!.*(🇭🇰|🇯🇵))(?!.*🇺🇸.*KXY).*$"
    timeout: 2000
    max-failed-times: 3

# [本地规则]
rules:
  - DOMAIN-KEYWORD,emby,Emby
  - RULE-SET,Speedtest,Proxy
  - RULE-SET,AI,AI
  - RULE-SET,Emby,Emby
  - RULE-SET,Google,Google
  - RULE-SET,YouTube,Google
  - RULE-SET,LAN,DIRECT 
  - GEOIP,CN,DIRECT
  - MATCH,Final
  
# [远程规则]
rule-providers:

  Speedtest:
     behavior: classical
     interval: 86400
     type: http
     path: ./Speedtest/Speedtest.yaml
     url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Speedtest/Speedtest.yaml

  Emby:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./Emby/Emby.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/Emby.list

  AI:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./AI/AI.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/AI.list
  
  Google:
     behavior: classical
     interval: 86400
     type: http
     path: ./Google/Google.yaml
     url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml

  YouTube:
     behavior: classical
     interval: 86400
     type: http
     path: ./YouTube/YouTube.yaml
     url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml

  LAN:
    behavior: classical
    interval: 86400
    type: http
    path: ./LAN/LAN.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml
