# [策略组]
proxy-groups:
  - name: "Proxy"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    include-all: true
    filter: "ISIF|KXY"
    proxies: 
      - 🇭🇰 CNF<-Dler
      - 🇭🇰 Bage<-Dler
      - 🇯🇵 wap<-Dler
      
  - name: "Final"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    proxies: 
      - HK
      - 🇯🇵 wap<-Dler
      - US
      
  - name: "AI"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    proxies: 
      - US
      - 🇯🇵 wap<-Dler

  - name: "Emby"
    type: load-balance
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
    include-all: true
    filter: “ISIF|KXY”
    proxies: 
      - 🇭🇰 CNF<-Dler
      - 🇭🇰 Bage<-Dler
      - 🇯🇵 wap<-Dler

  - name: "HK"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    filter: "ISIF"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800
    proxies: 
      - 🇭🇰 CNF<-Dler
      - 🇭🇰 Bage<-Dler
      
  - name: "US"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    filter: "KXY"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800

  - name: "🇭🇰 CNF<-Dler"
    type: url-test
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud(1).png
    interval: 1800
    include-all: true
    filter: "CNF<-Dler"

  - name: "🇭🇰 Bage<-Dler"
    type: url-test
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud(1).png
    interval: 1800
    include-all: true
    filter: "Bage<-Dler"

  - name: "🇯🇵 wap<-Dler"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud(1).png
    filter: "🇯🇵"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800

  - name: "Dler"
    type: select
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/DlerCloud(1).png
    filter: "^(?!.*(🇭🇰|🇯🇵))(?!.*🇺🇸.*KXY).*$"
    timeout: 2000
    max-failed-times: 3

# [本地规则]
rules:
  - DOMAIN-KEYWORD,emby,Emby
  - RULE-SET,Speedtest,Proxy
  - RULE-SET,AI,AI
  - RULE-SET,Emby,Emby
  - RULE-SET,LAN,DIRECT 
  - GEOIP,CN,DIRECT
  - MATCH,Final
  
# [远程规则]
rule-providers:

  Speedtest:
     behavior: classical
     interval: 86400
     type: http
     path: ./Emby/Emby.list
     url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Speedtest/Speedtest.yaml

  Emby:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./Emby/Emby.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/Emby.list

  AI:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./AI/AI.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/AI.list
     
  LAN:
    behavior: classical
    interval: 86400
    type: http
    path: ./LAN/LAN.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml
