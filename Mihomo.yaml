# [策略组]
proxy-groups:
  - name: "𝗣𝗿𝗼𝘅𝘆"
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    timeout: 2000
    max-failed-times: 3
    include-all: true
      
  - name: "𝗔𝗜"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    proxies: 
      - 𝗝𝗣
      - 𝗨𝗦

  - name: "𝗚𝗼𝗼𝗴𝗹𝗲"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
    proxies: 
      - 𝗨𝗦
      - 𝗛𝗞

  - name: "𝗘𝗺𝗯𝘆"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
    proxies: 
      - 𝗝𝗣
      - 𝗨𝗦

  - name: "𝗛𝗞"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    filter: "香港|港|🇭🇰|(?i)Hongkong"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800
    
  - name: "𝗝𝗣"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    filter: "日本|日|🇯🇵|(?i)Japan"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800
 
  - name: "𝗨𝗦"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    filter: "美国|美|🇺🇸|(?i)States"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 1800

# [本地规则]
rules:
  - DOMAIN-KEYWORD,emby,𝗘𝗺𝗯𝘆
  - RULE-SET,𝗦𝗽𝗲𝗲𝗱𝘁𝗲𝘀𝘁,𝗣𝗿𝗼𝘅𝘆
  - RULE-SET,𝗣𝗮𝘆𝗣𝗮𝗹,𝗛𝗞
  - RULE-SET,𝗔𝗜,𝗔𝗜
  - RULE-SET,𝗘𝗺𝗯𝘆,𝗘𝗺𝗯𝘆
  - RULE-SET,𝗚𝗼𝗼𝗴𝗹𝗲,𝗚𝗼𝗼𝗴𝗹𝗲
  - RULE-SET,𝗬𝗼𝘂𝗧𝘂𝗯𝗲,𝗚𝗼𝗼𝗴𝗹𝗲
  - RULE-SET,𝗟𝗔𝗡,DIRECT 
  - GEOIP,CN,DIRECT
  - MATCH,𝗣𝗿𝗼𝘅𝘆
  
# [远程规则]
rule-providers:

  𝗦𝗽𝗲𝗲𝗱𝘁𝗲𝘀𝘁:
    behavior: classical
    interval: 86400
    type: http
    path: ./Speedtest/Speedtest.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Speedtest/Speedtest.yaml

  𝗣𝗮𝘆𝗣𝗮𝗹:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./PayPal/PayPal.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/PayPal.list
  
  𝗘𝗺𝗯𝘆:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./Emby/Emby.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/Emby.list

  𝗔𝗜:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./AI/AI.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/AI.list
     
  𝗚𝗼𝗼𝗴𝗹𝗲:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./Google/Google.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/Google.list

  𝗬𝗼𝘂𝗧𝘂𝗯𝗲:
     behavior: classical
     interval: 86400
     type: http
     format: text
     path: ./YouTube/YouTube.list
     url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/YouTube.list
     
  𝗟𝗔𝗡:
    behavior: classical
    interval: 86400
    type: http
    path: ./LAN/LAN.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml
