    nterval: 86400
    path: ./PayPal.list
    url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/PayPal.list

  CDN:
    behavior: classical
    type: http
    format: text
    nterval: 86400
    path: ./CDN.list
    url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/CDN.list

  LAN:
    behavior: classical
