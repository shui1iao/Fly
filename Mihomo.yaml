proxy-groups:
  - name: "Proxy"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Speedtest.png
    include-all: true
    filter: "^(?!.*(Flower-|ikuu-)).*$"
      
  - name: "Final"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    proxies: 
      - HK
      - JP
      - SG
      - US
      - Flower

  - name: "AI"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    proxies:
      - US
      - JP
      - SG
      
  - name: "Emby"
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
    proxies:
      - Flower
      - ikuu
      - Final

  - name: "HK"
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    include-all: true
    filter: "^(?!.*(?:IEPL|🇯🇵|🇸🇬|🇺🇸|🇨🇳|🇩🇪|🇨🇳|香港Z)).*$"
    
  - name: "JP"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    filter: "^(?!.*(?:IEPL|🇭🇰|🇸🇬|🇺🇸|🇨🇳|🇩🇪|🇨🇳)).*$"

  - name: "SG"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
    filter: "^(?!.*(?:IEPL|🇭🇰|🇯🇵|🇺🇸|🇨🇳|🇩🇪|🇨🇳)).*$"

  - name: "US"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    filter: "^(?!.*(?:IEPL|🇭🇰|🇯🇵|🇸🇬|🇩🇪|🇨🇳)).*$"

  - name: "Flower"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/06jichang/FlowerCloud.png
    filter: "Flower-"
    hidden: true
    
  - name: "Flower-HK"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/06jichang/FlowerCloud.png
    filter: "Flower-HK"
    hidden: true
    
  - name: "ikuu"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/06jichang/FlowerCloud.png
    filter: "ikuu-"
    hidden: true

  - name: "Flower-JP"
    type: url-test
    include-all: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/06jichang/FlowerCloud.png
    filter: "Flower-JP"
    hidden: true

