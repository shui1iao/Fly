proxy-groups:
  - name: "Proxy"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Speedtest.png
    include-all: true
      
rule-providers:

  LAN:
    behavior: classical
    interval: 86400
    type: http
    format: text
    path: ./Lan.list
    url: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Rules/Lan.list
  
rules:
  - RULE-SET,LAN,DIRECT 
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
